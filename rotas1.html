<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotas Seguras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'judson', sans-serif;
    }

    body {
      background-color: #d9d9d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Moldura simulando celular */
    .celular {
      background-color: #0F171C;
      width: 320px;
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      background-color: #122026;
      padding: 14px 0;
      font-size: 1.1rem;
      text-align: center;
      color: #fff;
    }

    .back-button {
      position: absolute;
      left: 15px;
      top: 13px;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-button:hover {
      color: #A1CF82;
    }

    .conteudo {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      color: white;
    }

    .destino-group {
      display: flex;
      align-items: center;
      width: 90%;
      margin: 10px 0;
      background-color: #EAEAEA;
      border-radius: 10px;
      overflow: hidden;
    }

    input {
      flex-grow: 1;
      border: none;
      background-color: transparent;
      color: #0F171C;
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-buscar {
      background-color: transparent;
      border: none;
      color: #527D6F;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 8px 10px;
      transition: 0.3s;
    }

    .btn-buscar:hover {
      color: #34574C;
    }

    #map {
      width: 90%;
      height: 300px;
      margin-top: 10px;
      border-radius: 12px;
      border: 2px solid #527D6F;
    }

    button {
      background-color: #780C28;
      color: white;
      border: none;
      padding: 10px;
      width: 90%;
      font-size: 0.95rem;
      border-radius: 10px;
      margin: 15px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #911838;
    }

    footer {
      background-color: #122026;
      color: #ccc;
      text-align: center;
      font-size: 0.8rem;
      padding: 8px;
    }
  </style>
</head>

<body>
  <div class="celular">
    <header>
      <a href="marinho.html" class="back-button"><i class="fa-solid fa-arrow-left"></i></a>
      Rotas Seguras
    </header>

    <div class="conteudo">
      <div class="destino-group">
        <input type="text" id="destino" placeholder="Digite o destino ou clique no mapa...">
        <button class="btn-buscar" onclick="buscarDestino()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <div id="map"></div>

      <button onclick="mostrarRotas()">Mostrar rotas seguras</button>
    </div>

    <footer>© 2025 Rotas Seguras</footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([-23.3103, -51.1628], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let localAtual = null;
    let destinoSelecionado = null;
    let destinoCoords = null;

    function definirDestino(latlng) {
      if (destinoSelecionado) map.removeLayer(destinoSelecionado);
      destinoCoords = [latlng.lat, latlng.lng];
      destinoSelecionado = L.marker(destinoCoords).addTo(map).bindPopup("Destino").openPopup();
      map.setView(destinoCoords, 15);
      document.getElementById('destino').value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
    }

    navigator.geolocation.getCurrentPosition(pos => {
      localAtual = [pos.coords.latitude, pos.coords.longitude];
      L.marker(localAtual).addTo(map).bindPopup("Você está aqui").openPopup();
      map.setView(localAtual, 15);
    }, error => {
      console.error("Erro ao obter localização:", error);
      alert("Não foi possível obter a localização atual.");
    });

    map.on('click', e => definirDestino(e.latlng));

    function buscarDestino() {
      const endereco = document.getElementById('destino').value.trim();
      if (!endereco) return alert("Digite um endereço ou coordenadas válidas.");

      const partes = endereco.split(',').map(p => p.trim());
      if (partes.length === 2 && !isNaN(parseFloat(partes[0])) && !isNaN(parseFloat(partes[1]))) {
        const lat = parseFloat(partes[0]);
        const lon = parseFloat(partes[1]);
        if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180)
          return definirDestino({ lat, lng: lon });
      }

      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(endereco)}&format=json&limit=1`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            definirDestino({ lat, lng: lon });
            document.getElementById('destino').value = data[0].display_name;
          } else {
            alert("Endereço não encontrado.");
          }
        })
        .catch(err => {
          console.error("Erro na geocodificação:", err);
          alert("Erro ao buscar o endereço.");
        });
    }

    function mostrarRotas() {
      if (!localAtual) return alert("Aguardando localização atual...");
      if (!destinoCoords) return alert("Selecione um destino no mapa ou utilize o botão 'Buscar'!");

      localStorage.setItem("origem", JSON.stringify(localAtual));
      localStorage.setItem("destino", JSON.stringify(destinoCoords));

      window.location.href = "rotas2.html";
    }
  </script>
</body>

</html>
