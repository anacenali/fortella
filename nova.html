<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Judson:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "judson", sans-serif;
    }

    body {
      background-color: #d9e4df;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px;
    }

    .celular {
      background-color: #c9d9d3;
      width: 280px;
      min-height: 500px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background-color: #78a89b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    header i {
      font-size: 1.3rem;
      color: #0f241e;
      cursor: pointer;
      transition: 0.3s;
    }

    header i:hover {
      color: #ffffff;
    }

    /* Imagem diária */
    .imagem-diaria {
      background-color: #4e7f73;
      border-radius: 8px;
      margin: 10px;
      height: 90px;
      padding: 10px;
      color: #f2f2f2;
      position: relative;
    }

    .imagem-diaria p {
      font-size: 0.85rem;
    }

    .imagem-diaria img {
      width: 70px;
      position: absolute;
      top: 8px;
      right: 10px;
      transform: rotate(10deg);
      border-radius: 6px;
      box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.3);
    }

    /* Seção Coração */
    .secao {
      background-color: #4e7f73;
      color: #fff;
      font-weight: 500;
      margin: 0 10px;
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .secao i {
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .secao i:hover {
      color: #c9d9d3;
    }

    /* Galeria */
    .galeria {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
    }

    .galeria img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .galeria img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="celular">
    <!-- topo -->
    <header>
      <i class="fa-solid fa-arrow-left" onclick="voltarTelaInicial()"></i>
      <span>Novos</span>
      <i class="fa-solid fa-user" onclick="abrirConfiguracoes()"></i>
    </header>


    <!-- imagem diária -->
    <div class="imagem-diaria">
      <p>Imagem diária</p>
      <img src="img/imagem_diaria.png" alt="Imagem diária">
    </div>

        <!-- botão menu -->
    <div class="secao">
      <h4 onclick="abrirContatos()">Novos</h4>
      <i class="fa-solid fa-plus"></i>
    </div>

    <!-- galeria -->
    <div class="galeria">
      <img src="baldeFlor.png" alt="Desenho 1" onclick="abrirDesenho('baldeFlor.png')">
      <img src="doisPeixes.png" alt="Desenho 2" onclick="abrirDesenho('doisPeixes.png')">
      <img src="fundoMar.png" alt="Desenho 3" onclick="abrirDesenho('fundoMar.png')">
      <img src="coração.png" alt="Desenho 4" onclick="abrirDesenho('coracao.png')">
      <img src="camaleao.png" alt="Desenho 5" onclick="abrirDesenho('camaleao.png')">
      <img src="polvo.png" alt="Desenho 6" onclick="abrirDesenho('polvo.png')">
    </div>
  </div>

  <script>
    function voltarTelaInicial() {
      window.location.href = "inicio.html";
    }

    function abrirConfiguracoes() {
      window.location.href = "configuracoes.html";
    }

    function abrirContatos() {
      window.location.href = "contato.html";
    }

    function abrirDesenho(img) {
      window.location.href = "desenho.html?img=" + img;
    }
  </script>

</body>

</html>
