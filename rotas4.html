<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rotas Seguras - Trajeto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css">

  <style>
    /* ===== Layout geral ===== */
    body {
      font-family: Arial, sans-serif;
      background-color: #0F171C;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== Topo: informações ===== */
    .info-container {
      background-color: #122026;
      padding: 10px;
      color: white;
      text-align: left;
    }

    .info-container small {
      font-size: 12px;
      opacity: 0.7;
    }

    .info-field {
      background-color: #797979;
      color: black;
      padding: 10px;
      margin: 5px 0 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    /* ===== Mapa ===== */
    #map {
      flex-grow: 1;
      width: 100%;
      height: 100%;
    }

    /* ===== Botões flutuantes ===== */
    .action-bar {
      position: absolute;
      bottom: 110px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 999;
    }

    .floating-btn {
      background-color: white;
      color: black;
      padding: 10px 14px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .recentralizar {
      background-color: #A0C3C9;
      color: #122026;
    }

    .reportar {
      background-color: #FFC000;
      color: black;
    }

    /* ===== Barra inferior ===== */
    .nav-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: #122026;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 1000;
    }

    .nav-btn {
      background-color: #4D4D4D;
      color: white;
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .finalizar-btn { background-color: #780C28; }
    .compartilhar-chegada-btn { background-color: #527D6F; }

    .nav-info {
      flex-grow: 1;
      margin: 0 10px;
      background-color: #4D4D4D;
      border-radius: 25px;
      padding: 8px 0;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }

    /* ===== Ícone de localização ===== */
    .leaflet-marker-icon.user-location-marker {
      background-color: blue;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* ===== Responsividade extra ===== */
    @media (max-width: 480px) {
      .nav-btn {
        width: 50px;
        height: 50px;
        font-size: 18px;
      }
      .nav-info {
        font-size: 14px;
      }
      .floating-btn {
        font-size: 12px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="info-container">
    <small>Seu local:</small>
    <div id="localAtual" class="info-field">Localização atual</div>
    <small>Destino:</small>
    <div id="destinoFinal" class="info-field">Casa</div>
  </div>

  <div id="map"></div>

  <div class="action-bar">
    <button class="floating-btn recentralizar" onclick="recentralizarMapa()">⌖ Recentralizar</button>
    <button class="floating-btn reportar" onclick="alert('Reportar ainda não implementado.')">⚠️ Reportar</button>
  </div>

  <div class="nav-bottom">
    <button class="nav-btn finalizar-btn" onclick="finalizarRota()">✕</button>
    <div id="navInfo" class="nav-info">-- min<br>-- m</div>
    <button class="nav-btn compartilhar-chegada-btn" onclick="compartilharChegada()">⇶</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([-23.3103, -51.1628], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let routeLayer = null;
    let userMarker = null;
    let simulationInterval;
    const rotaSelecionada = JSON.parse(localStorage.getItem("rotaSelecionada"));
    const routePath = JSON.parse(localStorage.getItem("routePath"));
    let routeIndex = 0;

    if (rotaSelecionada && routePath && routePath.length > 0) {
      const [origem, destino] = rotaSelecionada;
      mostrarRota(origem, destino);
      const pontoInicial = [routePath[0][1], routePath[0][0]];
      userMarker = L.marker(pontoInicial, {
        icon: L.divIcon({ className: 'user-location-marker', iconSize: [16, 16], html: '' })
      }).addTo(map).bindPopup("Sua posição").openPopup();
      simulationInterval = setInterval(simularMovimento, 1000);
    } else {
      alert("Erro: rota não carregada. Voltando...");
      window.location.href = "rotas3.html";
    }

    function mostrarRota(origem, destino) {
      if (routeLayer) map.removeLayer(routeLayer);
      const url = `https://router.project-osrm.org/route/v1/driving/${origem[1]},${origem[0]};${destino[1]},${destino[0]}?overview=full&geometries=geojson`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          const route = data.routes[0];
          const line = L.geoJSON(route.geometry, { style: { color: "#527D6F", weight: 5 } }).addTo(map);
          L.marker(destino).addTo(map).bindPopup("Destino");
          routeLayer = line;
          map.fitBounds(line.getBounds(), { padding: [50, 50] });

          const distancia = route.distance.toFixed(0);
          const tempo = Math.ceil(route.duration / 60);
          document.getElementById('navInfo').innerHTML = `${tempo} min<br>${distancia} m`;
        });
    }

    function simularMovimento() {
      if (!userMarker || !routePath || routeIndex >= routePath.length) {
        clearInterval(simulationInterval);
        userMarker.bindPopup("Destino alcançado!").openPopup();
        document.getElementById('navInfo').innerHTML = "Destino alcançado";
        return;
      }
      const [lon, lat] = routePath[routeIndex];
      userMarker.setLatLng([lat, lon]);
      map.setView([lat, lon]);
      routeIndex++;
    }

    function recentralizarMapa() {
      if (userMarker) map.setView(userMarker.getLatLng(), 17);
    }

    function finalizarRota() {
      clearInterval(simulationInterval);
      localStorage.clear();
      alert("Trajeto finalizado. Obrigado por usar Rotas Seguras!");
      window.location.href = "finalizado.html";
    }

    function compartilharChegada() {
      clearInterval(simulationInterval);
      const currentPosition = userMarker ? userMarker.getLatLng() : "Desconhecida";
      if (navigator.share) {
        navigator.share({
          title: "Cheguei ao destino!",
          text: "Cheguei com segurança usando Rotas Seguras!",
          url: window.location.href
        });
      } else {
        alert("Compartilhamento não suportado. Localização: " + JSON.stringify(currentPosition));
      }
    }
  </script>
</body>
</html>
