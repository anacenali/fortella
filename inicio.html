<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Judson:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Judson", serif;
    }

    body {
      background-color: #d9e4df;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      background-color: #c9d9d3;
      width: 280px;
      min-height: 550px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
 header {
      background-color: #78a89b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    header i {
      font-size: 1.3rem;
      color: #0f241e;
      cursor: pointer;
      transition: 0.3s;
    }

    header i:hover {
      color: #ffffff;
    }

    /* SEÇÃO IMAGEM */
    .imagem-diaria {
      background-color: #4e7f73;
      border-radius: 8px;
      margin: 10px;
      height: 90px;
      padding: 10px;
      color: #f2f2f2;
      position: relative;
    }

    .imagem-diaria p {
      font-size: 0.85rem;
    }

    .imagem-diaria img {
      width: 70px;
      position: absolute;
      top: 8px;
      right: 10px;
      transform: rotate(10deg);
      border-radius: 6px;
      box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.3);
    }

    /* Galeria */
    .galeria {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
    }

    .galeria img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .galeria img:hover {
      transform: scale(1.05);
    }

    /* GRID DE BOTÕES */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
      background-color: white;
      flex-grow: 1;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .grid button {
      background-color: #527d6f;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      padding: 25px 0;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .grid button:hover {
      background-color: #406558;
      transform: scale(1.05);
    }

    .menu-btn {
      position: absolute;
      top: 119px;
      right: 20px;
      background: #40685C;
      color: white;
      border: none;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 8px;
    }

    @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css');
  </style>
</head>

<body>

  <div class="container">
    <!-- topo -->
    <header>
      <i class="fa-solid fa-arrow-left" onclick="voltarTelaInicial()"></i>
      <span>Início</span>
      <i class="fa-solid fa-user"></i>
    </header>


    <div class="imagem-diaria">
      <span>Imagem diária</span>
      <img src="imgdiaria.png" alt="Imagem diária">
    </div>

    <button class="menu-btn" onclick="abrirInicio()">☰</button>

    <section class="grid">
      <button onclick="abrirPagina('nova.html')">Nova</button>
      <button onclick="abrirPagina('flores.html')">Flores</button>
      <button onclick="abrirPagina('marinho.html')">Marinho</button>
      <button onclick="abrirPagina('animais.html')">Animais</button>
      <button onclick="abrirPagina('popular.html')">Popular</button>
      <button onclick="abrirPagina('coracao.html')">Coração</button>
    </section>
  </div>

<script>
  function voltarTelaInicial() {
    // Redireciona o usuário de volta para a tela inicial
    window.location.href = "tela_inicio.html";
  }

  function abrirInicio() {
    // Simula o menu (ainda em desenvolvimento)
    alert("Menu em construção!");
  }

  function abrirPagina(pagina) {
    // Abre a página selecionada ao clicar no botão
    window.location.href = pagina;
  }
</script>
</body>

</html>
