<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sair da Conta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
  }

  body {
    background: linear-gradient(135deg, #16222A, #3A6073);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .celular {
    background-color: #fff;
    width: 280px;
    min-height: 550px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, #0f1715, #b22b2b);
    color: #fff;
    padding: 14px 16px;
    font-size: 1rem;
  }

  header a {
    color: #fff;
    text-decoration: none;
  }

  header i {
    font-size: 1.3rem;
    cursor: pointer;
  }

  .conteudo {
    flex: 1;
    background-color: #f9f9f9;
    margin: 20px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
    text-align: center;
  }

  .conteudo h2 {
    color: #222;
    font-size: 1.1rem;
    margin-bottom: 15px;
  }

  .conteudo p {
    color: #333;
    font-size: 0.9rem;
    margin-bottom: 25px;
  }

  .botoes {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
  }

  .btn-voltar {
    background-color: #ccc;
    color: #111;
  }

  .btn-voltar:hover {
    background-color: #aaa;
    transform: scale(1.03);
  }

  .btn-sair {
    background: linear-gradient(90deg, #b22b2b, #8b1e1e);
    color: #fff;
  }

  .btn-sair:hover {
    background: linear-gradient(90deg, #941f1f, #b22b2b);
    transform: scale(1.03);
  }

  footer {
    background-color: #0f1715;
    color: #fff;
    text-align: center;
    padding: 10px;
    font-size: 0.8rem;
  }
</style>
</head>

<body>
  <div class="celular">
    <header>
      <a href="configuracoes.html"><i class="fa-solid fa-arrow-left"></i></a>
      <span>Sair da Conta</span>
      <i class="fa-solid fa-right-from-bracket"></i>
    </header>

    <div class="conteudo">
      <h2>Tem certeza que deseja sair?</h2>
      <p>Ao sair, você será desconectado da sua conta e precisará fazer login novamente.</p>

      <div class="botoes">
        <button class="btn-voltar" onclick="window.location.href='configuracoes.html'">Cancelar</button>
        <button class="btn-sair" onclick="confirmarSaida()">Sair</button>
      </div>
    </div>

    <footer>
      <p>© 2025 Sistema de Configurações</p>
    </footer>
  </div>

  <script>
    function confirmarSaida() {
      const confirmacao = confirm("Deseja realmente sair da conta?");
      if (confirmacao) {
        alert("Você saiu da conta com sucesso!");
        window.location.href = "cadastro.html";
      }
    }
  </script>
</body>
</html>
