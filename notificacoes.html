<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificações</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
  }

body {
background: linear-gradient(135deg, #16222A, #3A6073);
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}

.celular {
background-color: #fff;
width: 320px;
min-height: 550px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.4);
display: flex;
flex-direction: column;
overflow: hidden;
animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
from {opacity: 0; transform: translateY(20px);}
to {opacity: 1; transform: translateY(0);}
}

header {
display: flex;
align-items: center;
justify-content: space-between;
background: linear-gradient(90deg, #0f1715, #b22b2b);
color: #fff;
padding: 14px 16px;
font-size: 1rem;
}

header a {
color: #fff;
text-decoration: none;
}

header i {
font-size: 1.3rem;
cursor: pointer;
}

.conteudo {
flex: 1;
background-color: #f9f9f9;
margin: 20px;
padding: 15px;
border-radius: 12px;
box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
}

.conteudo h2 {
color: #222;
text-align: center;
font-size: 1.1rem;
margin-bottom: 15px;
}

.item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 0;
border-bottom: 1px solid #ccc;
}

.item:last-child {
border-bottom: none;
}

.label {
font-size: 0.9rem;
color: #111;
}

/* Switch customizado */
.switch {
position: relative;
display: inline-block;
width: 42px;
height: 24px;
}

.switch input {
opacity: 0;
width: 0;
height: 0;
}

.slider {
position: absolute;
cursor: pointer;
top: 0;
left: 0;
right: 0;
bottom: 0;
background-color: #bbb;
border-radius: 24px;
transition: .4s;
}

.slider:before {
position: absolute;
content: "";
height: 18px;
width: 18px;
left: 3px;
bottom: 3px;
background-color: white;
border-radius: 50%;
transition: .4s;
}

input:checked + .slider {
background-color: #b22b2b;
}

input:checked + .slider:before {
transform: translateX(18px);
}

button {
width: 100%;
margin-top: 25px;
background: linear-gradient(90deg, #b22b2b, #8b1e1e);
color: #fff;
border: none;
padding: 10px;
border-radius: 10px;
font-size: 0.95rem;
cursor: pointer;
transition: transform 0.2s, background 0.3s;
}

button:hover {
transform: scale(1.03);
background: linear-gradient(90deg, #941f1f, #b22b2b);
}

.mensagem {
text-align: center;
color: green;
font-weight: 500;
font-size: 0.9rem;
margin-top: 10px;
display: none;
}

footer {
background-color: #0f1715;
color: #fff;
text-align: center;
padding: 10px;
font-size: 0.8rem;
} </style>

</head>

<body>
  <div class="celular">
    <header>
      <a href="configuracoes.html"><i class="fa-solid fa-arrow-left"></i></a>
      <span>Notificações</span>
      <i class="fa-solid fa-bell"></i>
    </header>

<div class="conteudo">
  <h2>Gerencie suas notificações</h2>

  <div class="item">
    <span class="label">Notificações por E-mail</span>
    <label class="switch">
      <input type="checkbox" id="emailNotif" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="item">
    <span class="label">Notificações pelo App</span>
    <label class="switch">
      <input type="checkbox" id="appNotif">
      <span class="slider"></span>
    </label>
  </div>

  <div class="item">
    <span class="label">Alertas de Segurança</span>
    <label class="switch">
      <input type="checkbox" id="securityNotif" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button onclick="salvar()">Salvar Alterações</button>
  <div class="mensagem" id="mensagemSucesso">Configurações salvas com sucesso!</div>
</div>

<footer>
  <p>© 2025 Sistema de Configurações</p>
</footer>

  </div>

  <script>
    function salvar() {
      const msg = document.getElementById("mensagemSucesso");
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 3000);
    }
  </script>

</body>
</html>
