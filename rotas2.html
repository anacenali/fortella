<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Rotas Seguras - Etapa 2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'judson', sans-serif;
    }

    body {
      background-color: #d9d9d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    header {
      position: relative;
      background-color: #122026;
      padding: 12px 0;
      font-size: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .celular {
      background-color: #0F171C;
      width: 320px;
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }

    .back-button {
      position: absolute;
      left: 15px;
      top: 13px;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-button:hover {
      color: #A1CF82;
    }

    #map {
      width: 90%;
      height: 300px;
      margin: 10px 0;
      border-radius: 12px;
      border: 2px solid #527D6F;
    }

    .btn {
      background-color: #780C28;
      color: white;
      border: none;
      padding: 10px;
      width: 90%;
      font-size: 0.95rem;
      border-radius: 10px;
      margin: 8px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .acidente {
      background-color: #B22222;
    }

    .arvore {
      background-color: #C8B400;
      color: #0F171C;
      font-weight: 600;
    }

    .seguro {
      background-color: #1E90FF;
    }

    .confirmar {
      background-color: #780C28;
      display: none;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    @media (max-width: 480px) {
      header h2 {
        font-size: 0.95rem;
      }

      .btn {
        font-size: 0.85rem;
        padding: 9px;
      }

      #map {
        height: 55vh;
      }
    }
  </style>
</head>

<body>
  <div class="celular">
    <header>
      <a href="rotas1.html" class="back-button">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h2>Rotas Seguras</h2>
    </header>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%; justify-content: center; flex: 1;">
      <button class="btn acidente" onclick="mostrarRota('acidente')">🚨 Acidente em andamento</button>
      <button class="btn arvore" onclick="mostrarRota('arvore')">🌳 Árvore no caminho</button>
      <button class="btn seguro" onclick="mostrarRota('seguro')">🛣️ Caminho seguro</button>

      <div id="map"></div>

      <button id="btnConfirmar" class="btn confirmar" onclick="confirmarRota()">Confirmar rota</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([-23.3103, -51.1628], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const origem = JSON.parse(localStorage.getItem("origem"));
    const destinoBase = JSON.parse(localStorage.getItem("destino"));
    let rotaAtual = null;
    let routeLayer = null;

    if (origem) {
      L.marker(origem).addTo(map).bindPopup("Origem").openPopup();
    }

    if (destinoBase) {
      L.marker(destinoBase).addTo(map).bindPopup("Destino").openPopup();
      if (origem) {
        map.fitBounds([origem, destinoBase], { padding: [50, 50] });
      } else {
        map.setView(destinoBase, 15);
      }
    }

    function mostrarRota(tipo) {
      if (routeLayer) map.removeLayer(routeLayer);

      let destino = [...destinoBase];
      let corLinha = "";

      if (tipo === "acidente") {
        destino[1] += 0.003;
        corLinha = "red";
      } else if (tipo === "arvore") {
        destino[0] -= 0.003;
        corLinha = "orange";
      } else if (tipo === "seguro") {
        corLinha = "blue";
      }

      rotaAtual = { tipo, origem, destino };

      const url = `https://router.project-osrm.org/route/v1/driving/${origem[1]},${origem[0]};${destino[1]},${destino[0]}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          const route = data.routes[0];
          const line = L.geoJSON(route.geometry, {
            style: { color: corLinha, weight: 5 }
          }).addTo(map);
          routeLayer = line;
          map.fitBounds(line.getBounds(), { padding: [50, 50] });
          document.getElementById("btnConfirmar").style.display = "block";
        })
        .catch(err => {
          alert("Erro ao carregar rota. Verifique a conexão ou coordenadas.");
          console.error(err);
        });
    }

    function confirmarRota() {
      if (!rotaAtual) return alert("Escolha uma rota primeiro!");
      localStorage.setItem("rotaSelecionada", JSON.stringify([rotaAtual.origem, rotaAtual.destino]));
      window.location.href = "rotas3.html";
    }
  </script>

</body>
</html>
