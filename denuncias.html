<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Denúncia</title>
  <link href="https://fonts.googleapis.com/css2?family=Judson:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Judson', sans-serif;
      background-color: #e9e9e9;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    h2 {
      margin-bottom: 20px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
    }

    .tela {
      background-color: #0e1312;
      border-radius: 15px;
      padding: 20px;
      width: 280px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      height: 90%;
      max-height: 550px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
    }

    header h2 {
      margin: 0;
    }

    .voltar {
      position: absolute;
      left: 10px;
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .voltar:hover {
      transform: scale(1.2);
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      padding: 10px;
      border: none;
      resize: none;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: #111;
    }

    textarea:focus {
      outline: 2px solid #800020;
    }

    button {
      background-color: #800020;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Poppins', sans-serif;
      transition: 0.3s;
    }

    button:hover {
      background-color: #c20f10;
      transform: scale(1.05);
    }

    .checkmark {
      font-size: 100px;
      color: #2ecc71;
      margin-bottom: 10px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0% { transform: scale(0.6); opacity: 0.2; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    .card {
      background-color: #222;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      text-align: left;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
    }

    strong {
      color: #c2c2c2;
    }
  </style>
</head>

<body>
  <div class="tela" id="tela1">
    <header>
      <a href="flores.html" class="voltar">←</a>
      <h2>Denúncia</h2>
    </header>
    <textarea id="descricao" placeholder="Descrição do Ocorrido"></textarea>
    <button onclick="enviarDenuncia()">Enviar Denúncia</button>
  </div>

  <div class="tela" id="tela2" style="display:none;">
    <header>
      <button class="voltar" onclick="voltar(1)">←</button>
      <h2>Denúncia</h2>
    </header>
    <div class="checkmark">✔</div>
    <h2>Denúncia concluída</h2>
    <button onclick="mostrarInformacoes()">Informações</button>
  </div>

  <div class="tela" id="tela3" style="display:none;">
    <header>
      <button class="voltar" onclick="voltar(2)">←</button>
      <h2>Encaminhamento de Denúncias</h2>
    </header>
    <div class="card">
      <p><strong>Administrador:</strong> Marcos Pereira</p>
      <p><strong>Órgão Destino:</strong> Secretaria de Segurança</p>
      <p><strong>Data de encaminhamento:</strong> 15/04/2024</p>
      <p><strong>Observações:</strong> Denúncia relacionada à segurança pública.</p>
      <p><strong>Protocolo:</strong> 6732804519</p>
    </div>
    <br>
    <button onclick="novaDenuncia()">Nova Denúncia</button>
  </div>

  <script>
    function enviarDenuncia() {
      const descricao = document.getElementById("descricao").value.trim();
      if (descricao === "") {
        alert("Por favor, descreva o ocorrido antes de enviar.");
        return;
      }
      document.getElementById("tela1").style.display = "none";
      document.getElementById("tela2").style.display = "flex";
    }

    function mostrarInformacoes() {
      document.getElementById("tela2").style.display = "none";
      document.getElementById("tela3").style.display = "flex";
    }

    function voltar(tela) {
      if (tela === 1) {
        document.getElementById("tela2").style.display = "none";
        document.getElementById("tela1").style.display = "flex";
      } else if (tela === 2) {
        document.getElementById("tela3").style.display = "none";
        document.getElementById("tela2").style.display = "flex";
      }
    }

    function novaDenuncia() {
      document.getElementById("descricao").value = "";
      document.getElementById("tela3").style.display = "none";
      document.getElementById("tela1").style.display = "flex";
    }
  </script>
</body>
</html>
