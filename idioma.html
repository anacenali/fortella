<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idioma</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #16222A, #3A6073);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .celular {
      background-color: #fff;
      width: 320px;
      min-height: 550px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #0f1715, #b22b2b);
      color: #fff;
      padding: 14px 16px;
      font-size: 1rem;
    }

    header a {
      color: #fff;
      text-decoration: none;
    }

    header i {
      font-size: 1.3rem;
      cursor: pointer;
    }

    .conteudo {
      flex: 1;
      background-color: #f9f9f9;
      margin: 20px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .conteudo h2 {
      color: #222;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      background-color: #fff;
      color: #111;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    select {
      border-color: #b22b2b;
      box-shadow: 0 0 6px rgba(178, 43, 43, 0.3);
    }

    button {
      width: 100%;
      margin-top: 25px;
      background: linear-gradient(90deg, #b22b2b, #8b1e1e);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button {
      transform: scale(1.03);
      background: linear-gradient(90deg, #941f1f, #b22b2b);
    }

    .mensagem {
      text-align: center;
      color: green;
      font-weight: 500;
      font-size: 0.9rem;
      margin-top: 15px;
      display: none;
    }

    footer {
      background-color: #0f1715;
      color: #fff;
      text-align: center;
      padding: 10px;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <div class="celular">
    <header>
      <a href="configuracoes.html"><i class="fa-solid fa-arrow-left"></i></a>
      <span>Idioma</span>
      <i class="fa-solid fa-language"></i>
    </header>

    <div class="conteudo">
      <h2>Selecione o Idioma</h2>
      <select id="idioma">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en-US">Inglês (EUA)</option>
        <option value="es-ES">Espanhol (Espanha)</option>
        <option value="fr-FR">Francês</option>
        <option value="de-DE">Alemão</option>
        <option value="it-IT">Italiano</option>
      </select> <button onclick="salvarIdioma()">Salvar Idioma</button>
      <div class="mensagem" id="mensagemSucesso">Idioma alterado com sucesso!</div>
    </div>

    <footer>
      <p>© 2025 Sistema de Configurações</p>
    </footer>

    <script>
      function salvarIdioma() {
        const idioma = document.getElementById("idioma").value;
        alert("Idioma alterado para: " + idioma);
      }
    </script>
</body>

</html>
