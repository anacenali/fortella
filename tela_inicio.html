<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início - Fortella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Judson:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/1b4a8b1f5c.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Judson", sans-serif;
    }

    body {
      background-color: #d9e4df;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px;
    }

    .celular {
      background-color: #c9d9d3;
      width: 280px;
      min-height: 500px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background-color: #78a89b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    header i {
      font-size: 1.3rem;
      color: #0f241e;
    }

    /* Imagem diária */
    .imagem-diaria {
      background-color: #4e7f73;
      border-radius: 8px;
      margin: 10px;
      height: 90px;
      padding: 10px;
      color: #f2f2f2;
      position: relative;
    }

    .imagem-diaria p {
      font-size: 0.85rem;
    }

    .imagem-diaria img {
      width: 70px;
      position: absolute;
      top: 8px;
      right: 10px;
      transform: rotate(10deg);
      border-radius: 6px;
      box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.3);
    }

    /* Seção do menu */
    .secao {
      background-color: #4e7f73;
      color: #fff;
      font-weight: 500;
      margin: 0 10px;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Ícone de menu (três tracinhos) */
    .menu-btn {
      width: 25px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-btn span {
      height: 3px;
      width: 100%;
      background-color: white;
      border-radius: 2px;
    }

    /* Galeria */
    .galeria {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
    }

    .galeria img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .galeria img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="celular">
    <!-- topo -->
    <header>
      <i class="fa-solid fa-house"></i>
      <span>Tela de início</span>
      <i class="fa-solid fa-user" onclick="abrirConfiguracoes()"></i>
    </header>

    <!-- imagem diária -->
    <div class="imagem-diaria">
      <p>Imagem diária</p>
      <img src="img/imagem_diaria.png" alt="Imagem diária">
    </div>

    <!-- botão menu (3 tracinhos empilhados) -->
    <div class="secao">
      <h4>Tela de início</h4>
      <div class="menu-btn" onclick="abrirInicio()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- galeria de desenhos -->
    <div class="galeria">
      <img src="baldeFlor.png" alt="Desenho 1" onclick="abrirDesenho('desenho1.jpg')">
      <img src="doisPeixes.png" alt="Desenho 2" onclick="abrirDesenho('desenho2.jpg')">
      <img src="fundoMar.png" alt="Desenho 3" onclick="abrirDesenho('desenho3.jpg')">
      <img src="coração.png" alt="Desenho 4" onclick="abrirDesenho('desenho4.jpg')">
      <img src="camaleao.png" alt="Desenho 5" onclick="abrirDesenho('desenho5.jpg')">
      <img src="polvo.png" alt="Desenho 6" onclick="abrirDesenho('desenho6.jpg')">
    </div>
  </div>

  <script>
    // Abre a tela com o desenho selecionado
    function abrirDesenho(img) {
      window.location.href = "desenho.html?img=" + img;
    }

    // Redireciona para a página início.html
    function abrirInicio() {
      window.location.href = "inicio.html";
    }
    function abrirConfiguracoes() {
      window.location.href = "configuracoes.html";
    }
  </script>

</body>

</html>
