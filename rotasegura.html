<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rota Segura</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Judson', sans-serif;
      margin: 0;
      background: #0F171C;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container-map {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      height: 95vh;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: #0F171C;
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-size: 1.2rem;
      position: relative;
      font-weight: bold;
    }

    .btn-voltar {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-voltar:hover {
      transform: translateY(-50%) scale(1.2);
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .btn-principal {
      background: #780C28;
      color: white;
      border: none;
      padding: 1rem;
      margin: 1rem;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-principal:hover {
      background: #921033;
      transform: scale(1.02);
    }

    .popup-label {
      background: white;
      color: #0F171C;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 8px;
      text-align: center;
    }

    /* 🔹 Responsividade */
    @media (max-width: 400px) {
      header {
        font-size: 1rem;
      }
      .btn-principal {
        padding: 0.9rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-map">
    <header>
      <button class="btn-voltar" onclick="window.location.href='lugarseguro.html'">←</button>
      <h2>Rota Segura</h2>
    </header>

    <div id="map"></div>

    <button id="compartilhar" class="btn-principal">📍 Compartilhar localização</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const destino = JSON.parse(localStorage.getItem('destino'));
    if (!destino) {
      alert("Nenhum destino selecionado. Redirecionando...");
      window.location.href = "lugarseguro.html";
    }

    const map = L.map('map').setView([-23.304, -51.17], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Obter localização atual do usuário
    navigator.geolocation.getCurrentPosition(pos => {
      const origem = [pos.coords.latitude, pos.coords.longitude];
      const destinoLatLng = [destino.lat, destino.lon];

      L.marker(origem).addTo(map).bindPopup("📍 Você está aqui").openPopup();

      const marcadorDestino = L.marker(destinoLatLng).addTo(map)
        .bindPopup(`<div class="popup-label">✅ ${destino.name || 'Destino'}</div>`);

      // Calcular rota
      const url = `https://router.project-osrm.org/route/v1/driving/${origem[1]},${origem[0]};${destino.lon},${destino.lat}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.routes || data.routes.length === 0) {
            throw new Error("Rota não encontrada");
          }
          const route = data.routes[0].geometry;
          const line = L.geoJSON(route, { color: "#527D6F", weight: 5 }).addTo(map);
          map.fitBounds(line.getBounds());
          marcadorDestino.openPopup();
        })
        .catch(() => alert("❌ Erro ao calcular a rota. Tente novamente."));
    }, () => {
      alert("⚠️ Não foi possível obter sua localização. Ative o GPS e recarregue a página.");
    });

    // Compartilhar localização
    document.getElementById('compartilhar').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: "Minha localização segura",
          text: "Estou indo para " + (destino.name || "meu local seguro"),
          url: window.location.href
        });
      } else {
        alert("📱 O compartilhamento não é suportado neste dispositivo.");
      }
    });
  </script>
</body>
</html>
